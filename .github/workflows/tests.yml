# Runs the test suite on every push and pull request.
# Tests use scripted fake LLMs only: no API key, no API cost.
# Actions are pinned to full commit SHAs (a tag like @v7 can be moved to other
# code); the comment names the release. Update both together.
name: tests

on:
  push:
  pull_request:

# Only runs tests: read access to the repo is all it needs.
permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest backend/tests -q
